{% extends 'base.html' %}

{% block content %}
  <div class="container mt-5">
    <h1>Edit Recipe</h1>
    <form method="POST" class="mt-4">
      <div class="mb-3">
        <label for="title" class="form-label">Recipe Title</label>
        <input type="text" class="form-control" id="title" name="title" value="{{ recipe['title'] }}" required>
      </div>
      <div class="mb-3">
        <label for="ingredients" class="form-label">Ingredients</label>
        <textarea class="form-control" id="ingredients" name="ingredients" rows="4" placeholder="List ingredients, one per line" required>{{ recipe['ingredients'] }}</textarea>
      </div>
      <div class="mb-3">
        <label for="instructions" class="form-label">Instructions</label>
        <textarea class="form-control" id="instructions" name="instructions" rows="5" placeholder="List steps, one per line" required>{{ recipe['instructions'] }}</textarea>
        <div class="form-text">Enter one instruction step per line.</div>
      </div>
      <div class="mb-3">
        <label for="prep_minutes" class="form-label">Prep Time (minutes)</label>
        <input type="number" class="form-control" id="prep_minutes" name="prep_minutes" min="0" value="{{ recipe['prep_minutes'] }}">
      </div>
      <div class="mb-3">
        <label for="source_url" class="form-label">Source Link (optional)</label>
        <input type="url" class="form-control" id="source_url" name="source_url" placeholder="https://example.com/recipe" value="{{ recipe['source_url'] or '' }}">
        <div class="form-text">Leave blank if no source link is available.</div>
      </div>
      <div class="d-grid gap-2 d-sm-flex">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('recipes.detail', id=recipe['id']) }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
